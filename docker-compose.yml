services:

  # ── Kafka (KRaft — sans Zookeeper) ──────────────────────────────────────
  kafka:
    image: apache/kafka:latest
    container_name: soa-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - soa-network

  # ── MS1 — Identity Service ───────────────────────────────────────────────
  ms1:
    build:
      context: .                              # ← racine du projet
      dockerfile: MS1-User-Service/dockerfile
    container_name: soa-ms1
    ports:
      - "50051:50051"
    environment:
      - MS1_PORT=50051
      - KAFKA_BROKER=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - soa-network

  # ── MS2 — Document Service ───────────────────────────────────────────────
  ms2:
    build:
      context: .                              # ← racine du projet
      dockerfile: MS2-document-service/dockerfile
    container_name: soa-ms2
    ports:
      - "50052:50052"
    environment:
      - MS2_PORT=50052
      - MS1_ADDR=ms1:50051
      - KAFKA_BROKER=kafka:9092
      - PROTO_MS1_PATH=/app/ms1-user-service/proto
    depends_on:
      kafka:
        condition: service_healthy
      ms1:
        condition: service_started
    networks:
      - soa-network

  # ── MS3 — Analytics Service ──────────────────────────────────────────────
  ms3:
    build:
      context: .                              # ← racine du projet
      dockerfile: MS3-Analytics-Service/dockerfile
    container_name: soa-ms3
    ports:
      - "50053:50053"
    environment:
      - MS3_PORT=50053
      - MS1_ADDR=ms1:50051
      - MS2_ADDR=ms2:50052
      - KAFKA_BROKER=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      ms1:
        condition: service_started
      ms2:
        condition: service_started
    networks:
      - soa-network

  # ── API Gateway ──────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/dockerfile
    container_name: soa-gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MS1_ADDR=ms1:50051
      - MS2_ADDR=ms2:50052
      - MS3_ADDR=ms3:50053
    depends_on:
      - ms1
      - ms2
      - ms3
    networks:
      - soa-network

# ── Network ──────────────────────────────────────────────────────────────────
networks:
  soa-network:
    driver: bridge
