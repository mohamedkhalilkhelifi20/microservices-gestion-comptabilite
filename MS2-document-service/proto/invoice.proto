syntax = "proto3";
import "common.proto";
package invoice;

//  ENTITÉ PRINCIPALE
message Invoice {
  string id             = 1;
  string type           = 2;  // standard | steg | sonede | internet | telephone | loyer | honoraires
  string numero         = 3;
  string client_id      = 4;
  string client_nom     = 5;  // dénormalisé depuis MS1
  string comptable_id   = 6;
  double montant_ht     = 7;
  double tva_rate       = 8;  // 7.0 | 13.0 | 19.0
  double tva_montant    = 9;
  double montant_ttc    = 10;
  string statut         = 11; // brouillon | validee | signee | envoyee | payee
  string signature_hash = 12; // SHA256 — vide si non signée
  string signed_by      = 13; // comptable_id signataire
  string signed_at      = 14; // timestamp ISO8601
  string details_json   = 15; // structure JSON libre selon le type de facture
  string created_at     = 16;
}

//  REQUESTS
message CreateInvoiceRequest {
  string type           = 1;
  string client_id      = 2;
  string client_nom     = 3;
  string comptable_id   = 4;
  double montant_ht     = 5;
  double tva_rate       = 6;
  string details_json   = 7; // JSON sérialisé côté appelant
}

message SignInvoiceRequest {
  string invoice_id    = 1;
  string comptable_id  = 2;
}

message UpdateInvoiceRequest {
  string invoice_id   = 1;
  double montant_ht   = 2;
  double tva_rate     = 3;
  string details_json = 4;
}

message DeleteInvoiceRequest {
  string invoice_id = 1;
}

message GetInvoiceRequest {
  string id = 1;
}

message GetClientInvoicesRequest {
  string client_id = 1;
}

//  RESPONSES
message InvoiceResponse {
  Invoice invoice = 1;
}

message InvoicesListResponse {
  repeated Invoice invoices = 1;
}

message SignResponse {
  bool   success        = 1;
  string signature_hash = 2;
  string signed_at      = 3;
}

message DeleteResponse {
  bool   success = 1;
  string message = 2;
}

//  SERVICE
service InvoiceService {
  rpc CreateInvoice     (CreateInvoiceRequest)     returns (InvoiceResponse);
  rpc UpdateInvoice     (UpdateInvoiceRequest)     returns (InvoiceResponse);
  rpc DeleteInvoice     (DeleteInvoiceRequest)     returns (DeleteResponse);
  rpc SignInvoice       (SignInvoiceRequest)        returns (SignResponse);
  rpc GetInvoice        (GetInvoiceRequest)         returns (InvoiceResponse);
  rpc GetClientInvoices (GetClientInvoicesRequest)  returns (InvoicesListResponse);
  rpc GetAllInvoices    (common.EmptyRequest)       returns (InvoicesListResponse);
}

