syntax = "proto3";

import "common.proto";
package audit;

//  ENTITÉ PRINCIPALE
message AuditLog {
  string id           = 1;
  string client_id    = 2;
  string action       = 3;  // create | update | delete | submit | validate
  string entity_type  = 4;  // facture | declaration | alerte | report
  string entity_id    = 5;
  string performed_by = 6;  // user_id ou system
  string details      = 7;  // JSON stringifié des changements
  string created_at   = 8;
}

//  REQUESTS
message GetAuditLogsByClientRequest {
  string client_id = 1;
}

message GetAuditLogsByEntityRequest {
  string entity_type = 1;
  string entity_id   = 2;
}

//  RESPONSES
message AuditLogResponse {
  AuditLog audit_log = 1;
}

message AuditLogsListResponse {
  repeated AuditLog audit_logs = 1;
}

//  SERVICE — lecture uniquement (createAuditLog géré par Kafka consumer)
service AuditService {
  rpc GetAuditLogsByClient  (GetAuditLogsByClientRequest) returns (AuditLogsListResponse);
  rpc GetAuditLogsByEntity  (GetAuditLogsByEntityRequest) returns (AuditLogsListResponse);
  rpc GetAllAuditLogs       (common.EmptyRequest)         returns (AuditLogsListResponse);
}
