###  MS1 — Identity Service
type Cabinet {
    id:         ID!
    nom:        String!
    adresse:    String
    email:      String!
    telephone:  String
    created_at: String
}

type Comptable {
    id:             ID!
    nom:            String!
    email:          String!
    telephone:      String
    specialite:     String!
    cabinet_id:     ID!
    ordre_ordinal:  String
    numero_licence: String
    created_at:     String
}

type Client {
    id:               ID!
    nom:              String!
    email:            String!
    telephone:        String
    type:             String!
    matricule_fiscal: String
    cabinet_id:       ID!
    adresse:          String
    created_at:       String
}

type Assignation {
    id:           ID!
    comptable_id: ID!
    client_id:    ID!
    specialite:   String
    date_debut:   String
    statut:       String
}

###  MS2 — Document Service
type Invoice {
    id:             ID!
    type:           String!
    numero:         String!
    client_id:      ID!
    client_nom:     String!
    comptable_id:   ID!
    montant_ht:     Float!
    tva_rate:       Float!
    tva_montant:    Float!
    montant_ttc:    Float!
    statut:         String!
    signature_hash: String
    signed_by:      String
    signed_at:      String
    details_json:   String
    created_at:     String!
}

type SignResponse {
    success:        Boolean!
    signature_hash: String!
    signed_at:      String!
}

type Declaration {
    id:           ID!
    client_id:    ID!
    client_nom:   String!
    comptable_id: ID!
    type:         String!
    periode:      String!
    montant:      Float!
    statut:       String!
    validated_by: String
    validated_at: String
    created_at:   String!
}

type DeleteResponse {
    success: Boolean!
    message: String!
}

### Analytics Service

type Alerte {
    id:          ID!
    client_id:   ID!
    type:        String!
    message:     String!
    severity:    String!
    entity_id:   String!
    entity_type: String!
    is_read:     Boolean!
    created_at:  String!
}

type Report {
    id:         ID!
    client_id:  ID!
    type:       String!
    periode:    String!
    statut:     String!
    contenu:    String!
    created_at: String!
}

type Stat {
    id:               ID!
    client_id:        ID!
    periode:          String!
    chiffre_affaires: Float!
    total_charges:    Float!
    tva_nette:        Float!
    resultat_net:     Float!
    nb_factures:      Int!
    nb_declarations:  Int!
    created_at:       String!
}

type AuditLog {
    id:           ID!
    client_id:    ID!
    action:       String!
    entity_type:  String!
    entity_id:    String!
    performed_by: String!
    details:      String!
    created_at:   String!
}

type Dashboard {
    client_id:  ID!
    stats:      [Stat]
    alertes:    [Alerte]
    reports:    [Report]
    audit_logs: [AuditLog]
}

###  QUERIES
type Query {

    #MS1
    cabinet(id: ID!):                            Cabinet
    cabinets:                                    [Cabinet]

    comptable(id: ID!):                          Comptable
    comptables:                                  [Comptable]
    comptablesBySpecialite(specialite: String!): [Comptable]

    client(id: ID!):                             Client
    clients:                                     [Client]

    assignationsByClient(client_id: ID!):        [Assignation]

    # MS2
    invoice(id: ID!):                            Invoice
    invoices:                                    [Invoice]
    invoicesByClient(client_id: ID!):            [Invoice]

    declaration(id: ID!):                        Declaration
    declarations:                                [Declaration]
    declarationsByClient(client_id: ID!):        [Declaration]

    #Alertes
    alertes:                                     [Alerte]
    alertesByClient(client_id: ID!):             [Alerte]

    # Reports
    report(id: ID!):                             Report
    reports:                                     [Report]
    reportsByClient(client_id: ID!):             [Report]

    #Stats
    stat(id: ID!):                               Stat
    stats:                                       [Stat]
    statsByClient(client_id: ID!):               [Stat]

    #Audit
    auditLogs:                                   [AuditLog]
    auditLogsByClient(client_id: ID!):           [AuditLog]
    auditLogsByEntity(entity_type: String!, entity_id: ID!): [AuditLog]

    # Dashboard
    dashboard(client_id: ID!):                   Dashboard
}


###  MUTATIONS
type Mutation {

    #Cabinet
    createCabinet(
        nom:       String!
        adresse:   String
        email:     String!
        telephone: String
    ): Cabinet

    # Comptable
    createComptable(
        nom:            String!
        email:          String!
        telephone:      String
        specialite:     String!
        cabinet_id:     ID!
        ordre_ordinal:  String
        numero_licence: String
    ): Comptable

    # Client
    createClient(
        nom:              String!
        email:            String!
        telephone:        String
        type:             String!
        matricule_fiscal: String
        cabinet_id:       ID!
        adresse:          String
    ): Client

    # Assignation
    assignComptableToClient(
        comptable_id: ID!
        client_id:    ID!
        specialite:   String
        date_debut:   String
    ): Assignation

    #Invoice
    createInvoice(
        type:         String!
        client_id:    ID!
        client_nom:   String!
        comptable_id: ID!
        montant_ht:   Float!
        tva_rate:     Float!
        details_json: String
    ): Invoice

    updateInvoice(
        invoice_id:   ID!
        montant_ht:   Float
        tva_rate:     Float
        details_json: String
        statut:       String
    ): Invoice

    deleteInvoice(
        invoice_id: ID!
    ): DeleteResponse

    signInvoice(
        invoice_id:   ID!
        comptable_id: ID!
    ): SignResponse

    #Declaration
    createDeclaration(
        client_id:    ID!
        client_nom:   String!
        comptable_id: ID!
        type:         String!
        periode:      String!
        montant:      Float!
    ): Declaration

    updateDeclaration(
        declaration_id: ID!
        montant:        Float
        periode:        String
    ): Declaration

    deleteDeclaration(
        declaration_id: ID!
    ): DeleteResponse

    validateDeclaration(
        declaration_id: ID!
        comptable_id:   ID!
    ): Declaration

    #Alerte
    createAlerte(
        client_id:   ID!
        type:        String!
        message:     String!
        severity:    String!
        entity_id:   String!
        entity_type: String!
    ): Alerte

    # Report
    createReport(
        client_id:      ID!
        type:           String!
        periode:        String!
        facture_id:     ID
        declaration_id: ID
    ): Report

    updateReport(
        id:      ID!
        statut:  String
        contenu: String
    ): Report

    deleteReport(
        id: ID!
    ): DeleteResponse
}
